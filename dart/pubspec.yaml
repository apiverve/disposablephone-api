name: apiverve_disposablephone
description: "Disposable Phone Number Checker is a phone fraud API that flags temporary, burner and virtual phone numbers published on SMS-receiving sites. Pass a number in E.164 format to check whether it is disposable and see the date it was first seen on those lists."
version: 1.2.3
homepage: https://apiverve.com/marketplace/disposablephone?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/disposablephone-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
