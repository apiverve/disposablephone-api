[project]
name = "apiverve-disposablephonenumberchecker"
version = "1.2.5"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Disposable Phone Number Checker is a phone fraud API that flags temporary, burner and virtual phone numbers published on SMS-receiving sites. Pass a number in E.164 format to check whether it is disposable and see the date it was first seen on those lists."
keywords = ["disposable phone number api", "phone fraud api", "burner phone check", "temporary phone number detection", "phone number spam detection"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/disposablephone?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/disposablephone?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/disposablephone-api"
Twitter = "https://twitter.com/apivervehq"
